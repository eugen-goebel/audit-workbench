[project]
name = "audit-workbench"
version = "0.1.0"
description = "IT audit analytics for banks: access review, segregation of duties, journal entry testing and change management on synthetic data, mapped to DORA."
readme = "README.md"
license = "MIT"
authors = [{ name = "Eugen Goebel" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is handled by the formatter
ignore = ["E501"]
