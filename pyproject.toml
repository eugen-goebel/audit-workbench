[project]
name = "audit-workbench"
version = "0.1.0"
description = "IT audit analytics for banks: access review, segregation of duties, journal entry testing and change management on synthetic data, mapped to DORA."
readme = "README.md"
license = "MIT"
authors = [{ name = "Eugen Goebel" }]
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.60",
    "networkx>=3.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "typer>=0.27",
]

[project.scripts]
awb = "audit_workbench.cli:app"

[project.optional-dependencies]
workpaper = [
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
]
dashboard = [
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pypdf>=6.21.4",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "dashboard_app: Streamlit AppTest smoke tests; the CI job `dashboard` runs them, the `test` job skips them",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is handled by the formatter
ignore = ["E501"]
