name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests with coverage
        run: uv run pytest -v -m "not dashboard_app" --cov=audit_workbench --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Coverage summary
        if: always() && matrix.python-version == '3.12'
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run python -c "import xml.etree.ElementTree as ET; print(f\"Line coverage: {float(ET.parse('coverage.xml').getroot().get('line-rate'))*100:.1f}%\")" >> "$GITHUB_STEP_SUMMARY"

  ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Generate banks and check findings against ground truth
        run: |
          # pipefail keeps awb's exit code through tee, so a mismatch fails the step.
          # Both seeds are always checked; the step fails if either check failed.
          set -o pipefail
          status=0
          for SEED in 7 11; do
            uv run awb generate "data/generated/s$SEED" --seed "$SEED"
            uv run awb check-ground-truth "data/generated/s$SEED" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "$status"

  # Not a required check (spec phase-5-dashboard, section 7): the Streamlit smoke tests stay out of
  # the `test` job (marker dashboard_app), so a flaky run of the app cannot block a merge.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Dashboard tests (views, guard test, Streamlit app)
        run: uv run pytest -v tests/dashboard tests/test_cli_dashboard.py
